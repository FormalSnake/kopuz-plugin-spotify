[package]
name = "kopuz-plugin-spotify"
version = "0.1.0"
authors = ["FormalSnake"]
edition = "2024"
rust-version = "1.95.0"
description = "A Kopuz plugin: Spotify, streamed over the client's own protocol."
license = "MIT"
repository = "https://github.com/FormalSnake/kopuz-plugin-spotify"
publish = false

[lib]
crate-type = ["cdylib"]

[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"

[dependencies]
kopuz-plugin-sdk = { git = "https://github.com/Kopuz-org/kopuz", rev = "c84c680e1f9ab3377c440d182d430003b5c523c6" }
base64 = "0.22"
hmac = "0.12"
librespot-protocol = { version = "0.8.0", default-features = false }
num-bigint = "0.4"
protobuf = "3.7"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
shannon = "0.2"

# Small beats fast: a plugin spends its time waiting on the network.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
